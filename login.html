<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Nissi Biriyani POS</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-image:
                radial-gradient(at 0% 0%, rgba(108, 92, 231, 0.2) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 184, 148, 0.1) 0px, transparent 50%);
        }

        .login-card {
            background: var(--bg-card);
            padding: 40px;
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 400px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            text-align: center;
        }

        .login-brand {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 30px;
            background: linear-gradient(to right, #fff, #9499ad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .error-msg {
            color: var(--danger);
            font-size: 14px;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <div class="login-card">
            <div class="login-brand">Nissi Biriyani POS</div>

            <p class="error-msg" id="error-msg">Invalid Credentials</p>

            <form onsubmit="event.preventDefault(); handleLogin();">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" id="username" class="form-input" placeholder="admin" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••" required>
                </div>
                <button type="submit" class="btn btn-primary"
                    style="width: 100%; justify-content: center; margin-top: 10px;">
                    Login
                </button>
            </form>
        </div>
    </div>

    <script>
        // Secure Auth Logic
        async function handleLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');
            const submitBtn = document.querySelector('button[type="submit"]');

            // Hash for 'admin123'
            const TARGET_HASH = '240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9';

            try {
                submitBtn.disabled = true;

                // Generate Hash
                const msgBuffer = new TextEncoder().encode(pass);
                const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

                if (user === 'admin' && hashHex === TARGET_HASH) {
                    localStorage.setItem('restaurant_app_auth', 'true');
                    window.location.href = 'index.html';
                } else {
                    throw new Error('Invalid Credentials');
                }
            } catch (e) {
                submitBtn.disabled = false;
                errorMsg.style.display = 'block';
                // Shake effect
                const card = document.querySelector('.login-card');
                card.style.transform = 'translateX(10px)';
                setTimeout(() => card.style.transform = 'translateX(-10px)', 100);
                setTimeout(() => card.style.transform = 'translate(0)', 200);
            }
        }

        // Redirect if already logged in
        if (localStorage.getItem('restaurant_app_auth') === 'true') {
            window.location.href = 'index.html';
        }
    </script>
</body>

</html>
