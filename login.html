<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Nissi Biriyani POS</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-image:
                radial-gradient(at 0% 0%, rgba(108, 92, 231, 0.2) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 184, 148, 0.1) 0px, transparent 50%);
        }

        .login-card {
            background: var(--bg-card);
            padding: 40px;
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 400px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            text-align: center;
        }

        .login-brand {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 30px;
            background: linear-gradient(to right, #fff, #9499ad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .error-msg {
            color: var(--danger);
            font-size: 14px;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <div class="login-card">
            <div class="login-brand">Nissi Biriyani POS</div>

            <p class="error-msg" id="error-msg">Invalid Credentials</p>

            <form onsubmit="event.preventDefault(); handleLogin();">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" id="username" class="form-input" placeholder="admin" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••" required>
                </div>
                <button type="submit" class="btn btn-primary"
                    style="width: 100%; justify-content: center; margin-top: 10px;">
                    Login
                </button>
            </form>
        </div>
    </div>

    <!-- Module type required for firebase imports -->
    <script type="module">
        import { auth, signInWithEmailAndPassword, onAuthStateChanged, setPersistence, browserSessionPersistence } from './firebase-config.js';

        // Check if already logged in
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // User is signed in
                localStorage.setItem('restaurant_app_auth', 'true'); // Keep local flag for legacy compatibility if needed
                window.location.href = 'index.html';
            }
        });

        // Expose handleLogin to global scope because it's called by onsubmit
        window.handleLogin = async function () {
            const userEmail = document.getElementById('username').value; // Treating username as email for now, or append domain
            let email = userEmail;

            // Auto-append domain if user just types "admin" (Convenience)
            if (!email.includes('@')) {
                email = email + '@nissipos.com';
            }

            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');
            const submitBtn = document.querySelector('button[type="submit"]');

            try {
                submitBtn.disabled = true;
                submitBtn.textContent = 'Logging in...';
                errorMsg.style.display = 'none';

                // Firebase Login
                await setPersistence(auth, browserSessionPersistence);
                await signInWithEmailAndPassword(auth, email, pass);

                // Redirect handled by onAuthStateChanged

            } catch (error) {
                console.error("Login Error:", error);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Login';

                // Show friendly error message
                errorMsg.textContent = "Invalid Email or Password";
                if (error.code === 'auth/too-many-requests') {
                    errorMsg.textContent = "Too many failed attempts. Try again later.";
                }

                errorMsg.style.display = 'block';

                // Shake effect
                const card = document.querySelector('.login-card');
                card.style.transform = 'translateX(10px)';
                setTimeout(() => card.style.transform = 'translateX(-10px)', 100);
                setTimeout(() => card.style.transform = 'translate(0)', 200);
            }
        };
    </script>
</body>

</html>
