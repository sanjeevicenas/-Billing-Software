<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS | Restaurant Billing</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <div class="app-container">
        <!-- Sidebar: Cart -->
        <aside class="cart-sidebar">
            <div class="cart-header">
                <h2>Current Order</h2>
                <button onclick="app.clearCart()" class="btn btn-outline" style="padding: 6px 10px; font-size: 12px;">
                    Clear
                </button>
            </div>

            <div id="cart-items" class="cart-items">
                <!-- Cart items will be injected here -->
                <div style="text-align: center; color: var(--text-secondary); margin-top: 40px;">
                    Cart is empty
                </div>
            </div>

            <div class="cart-footer">
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="subtotal">₹0.00</span>
                </div>
                <div class="summary-row total-row">
                    <span>Total</span>
                    <span id="total">₹0.00</span>
                </div>

                <button onclick="app.initiatePayment()" class="btn btn-primary pay-btn" id="pay-btn" disabled>
                    Pay Now
                </button>
            </div>
        </aside>

        <!-- Main Content: Menu -->
        <main class="main-content">
            <div class="top-bar">
                <div class="brand">Nissi Biriyani <span style="color:var(--accent)">POS</span></div>
                <div style="display: flex; align-items: center; gap: 15px;">
                    <div id="live-clock"
                        style="font-family: monospace; font-size: 16px; font-weight: 600; color: var(--text-secondary); background: var(--bg-card); padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);">
                        --:--:--</div>
                    <div>
                        <button onclick="app.logout()" class="btn btn-outline"
                            style="margin-right: 10px; border-color: var(--danger); color: var(--danger);">
                            Logout
                        </button>
                        <a href="manage.html" class="btn btn-outline">
                            Manage Menu
                        </a>
                    </div>
                </div>
            </div>

            <div id="menu-grid" class="menu-grid">
                <!-- Menu items injected here -->
            </div>
        </main>
    </div>

    <!-- Modals -->

    <!-- Payment Modal -->
    <div id="payment-modal" class="modal-overlay">
        <div class="modal">
            <h2 style="margin-bottom: 10px;">Payment</h2>
            <p style="color: var(--text-secondary); margin-bottom: 20px;">Scan QR to Pay</p>

            <div class="qr-placeholder">
                <img id="qr-code-img" src="" alt="QR Code">
            </div>

            <h3 id="payment-total" style="font-size: 24px; margin-bottom: 20px;">₹0.00</h3>

            <div style="display: flex; gap: 10px; justify-content: center;">
                <button onclick="app.cancelPayment()" class="btn btn-outline">Cancel</button>
                <button onclick="app.confirmPayment()" class="btn btn-success">Confirm & Print</button>
            </div>
        </div>
    </div>

    <!-- Receipt Print Area (Hidden on screen) -->
    <div id="receipt-area">
        <div style="text-align: center; margin-bottom: 20px; border-bottom: 1px dashed black; padding-bottom: 10px;">
            <h2 style="margin: 0;">Nissi Biriyani POS</h2>
            <p>16, Ward 52, Cemetery Road, Washermenpet, Chennai-600019</p>
            <p>+919940502717</p>
            <p id="receipt-date"></p>
            <p>Order #<span id="receipt-id"></span></p>
        </div>

        <div id="receipt-items"></div>

        <div style="border-top: 1px dashed black; padding-top: 10px; margin-top: 10px;">
            <div style="display: flex; justify-content: space-between;">
                <b>Total</b>
                <b id="receipt-total"></b>
            </div>
        </div>

        <div style="text-align: center; margin-top: 20px;">
            <p>Thank you for dining with us!</p>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>

</html>
